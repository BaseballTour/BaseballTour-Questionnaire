<!DOCTYPE html>
<html lang="ko">
<head>

<title>나의 야구 직관 스타일은?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --color-primary: #1c339b;
    --color-border: #d9d9d9;
    --color-border-selected: #848f91;
    --color-text: #151515;
    --color-text-muted: #606060;
    --color-track: #efeff0;
    --color-disabled: #d9d9d9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: var(--color-text);
    display: flex;
    justify-content: center;
  }

  .app-shell {
    width: 100%;
    max-width: 402px;
    min-height: 100dvh;
    background: #fff;
    position: relative;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    flex-direction: column;
    min-height: 100dvh;
    padding: 24px 20px 32px;
  }

  .screen.active {
    display: flex;
  }

  /* ---- Intro ---- */
  #screen-intro {
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding-top: 64px;
  }

  .intro-logo {
    width: 189px;
    height: auto;
    margin-top: 40px;
    margin-bottom: 32px;
  }

  .intro-title {
    font-weight: 700;
    font-size: 25px;
    color: var(--color-text);
    margin: 0;
  }

  .intro-spacer { flex: 1; }

  /* ---- Buttons ---- */
  .btn-primary {
    display: block;
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 10px;
    background: var(--color-primary);
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    text-align: center;
  }

  .btn-primary:disabled {
    background: var(--color-disabled);
    cursor: not-allowed;
  }

  /* Figma spec widths: intro CTA 230px, question/result CTA 336px */
  #btn-start { max-width: 230px; }
  #btn-next { max-width: 336px; }

  .btn-secondary {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: var(--color-text-muted);
    font-family: inherit;
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---- Question nav bar ---- */
  .q-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 328px;
    margin: 0 auto 8px;
  }

  .q-nav-arrow {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text);
    visibility: visible;
  }

  .q-nav-arrow:disabled {
    visibility: hidden;
    cursor: default;
  }

  .q-nav-arrow svg { width: 20px; height: 20px; }

  .q-progress-track {
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: var(--color-track);
    overflow: hidden;
  }

  .q-progress-fill {
    height: 100%;
    border-radius: 5px;
    background: var(--color-primary);
    transition: width 0.25s ease;
  }

  .q-label {
    text-align: center;
    font-weight: 600;
    font-size: 18px;
    margin: 4px 0 24px;
  }

  .q-emoji {
    width: 150px;
    height: 150px;
    display: block;
    margin: 0 auto 24px;
    object-fit: contain;
  }

  .q-title {
    text-align: center;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.4;
    margin: 0 0 28px;
    white-space: pre-line;
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 315px;
    margin: 0 auto 28px;
  }

  .q-option {
    width: 100%;
    text-align: center;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    background: #fff;
    color: var(--color-text);
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .q-option.selected {
    background: var(--color-primary);
    border-color: var(--color-border-selected);
    color: #fff;
    font-weight: 700;
  }

  .q-footer {
    margin-top: auto;
    display: flex;
    justify-content: center;
  }

  /* ---- Result ---- */
  #screen-result {
    align-items: center;
    text-align: center;
    padding-top: 40px;
  }

  .result-title {
    font-weight: 700;
    font-size: 20px;
    line-height: 1.6;
    margin: 0 0 16px;
  }

  .result-tagline {
    font-weight: 600;
    font-size: 15px;
    color: var(--color-text);
    margin: 0 0 32px;
  }

  .result-section-label {
    font-weight: 700;
    font-size: 15px;
    margin: 0 0 12px;
  }

  .result-box {
    width: 100%;
    max-width: 315px;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 16px;
    font-weight: 600;
    font-size: 15px;
    line-height: 20px;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
    white-space: pre-line;
  }

  .result-hashtags {
    font-weight: 600;
    font-size: 15px;
    color: var(--color-text-muted);
    letter-spacing: 0.02em;
    margin-bottom: 32px;
  }
</style>
</head>

  const state = {
    current: 0,
    answers: new Array(QUESTIONS.length).fill(null), // selected option index per question
  };

  const screens = {
    intro: document.getElementById("screen-intro"),
    question: document.getElementById("screen-question"),
    result: document.getElementById("screen-result"),
  };

  function showScreen(name) {
    Object.values(screens).forEach((s) => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    const idx = state.current;
    const q = QUESTIONS[idx];
    const selected = state.answers[idx];

    document.getElementById("q-label").textContent = `${idx + 1}번 질문`;
    document.getElementById("q-title").textContent = q.text;
    document.getElementById("progress-fill").style.width = `${((idx + 1) / QUESTIONS.length) * 100}%`;
    document.getElementById("q-image").src = `assets/imgs/Q${idx + 1}.png`;

    const optionsEl = document.getElementById("q-options");
    optionsEl.innerHTML = "";
    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "q-option" + (selected === i ? " selected" : "");
      btn.textContent = opt.label;
      btn.addEventListener("click", () => selectOption(i));
      optionsEl.appendChild(btn);
    });

    const prevBtn = document.getElementById("btn-prev");
    prevBtn.disabled = idx === 0;

    const nextArrow = document.getElementById("btn-next-arrow");
    const nextBtn = document.getElementById("btn-next");
    const hasAnswer = selected !== null;
    nextArrow.disabled = !hasAnswer;
    nextBtn.disabled = !hasAnswer;
    nextBtn.textContent = idx === QUESTIONS.length - 1 ? "결과 보기" : "다음으로";
  }

  function selectOption(i) {
    state.answers[state.current] = i;
    renderQuestion();
  }

  function goPrev() {
    if (state.current === 0) return;
    state.current -= 1;
    renderQuestion();
  }

  function goNext() {
    if (state.answers[state.current] === null) return;
    if (state.current === QUESTIONS.length - 1) {
      showResult();
      return;
    }
    state.current += 1;
    renderQuestion();
  }

  function computeResultType() {
    const totals = Object.fromEntries(TYPE_ORDER.map((t) => [t, 0]));
    QUESTIONS.forEach((q, i) => {
      const answerIdx = state.answers[i];
      if (answerIdx === null) return;
      const scores = q.options[answerIdx].scores;
      Object.entries(scores).forEach(([type, val]) => {
        totals[type] += val;
      });
    });
    let bestType = TYPE_ORDER[0];
    let bestScore = -Infinity;
    TYPE_ORDER.forEach((type) => {
      if (totals[type] > bestScore) {
        bestScore = totals[type];
        bestType = type;
      }
    });
    return bestType;
  }

  function showResult() {
    const type = computeResultType();
    const r = RESULTS[type];
    document.getElementById("result-image").src = `assets/imgs/${encodeURIComponent(r.name)}.png`;
    document.getElementById("result-title").textContent = `당신은 「${r.name}」`;
    document.getElementById("result-tagline").textContent = r.tagline;
    document.getElementById("result-desc").textContent = r.desc;
    document.getElementById("result-course").textContent = r.course;
    document.getElementById("result-hashtags").textContent = r.hashtags;
    showScreen("result");
  }

  function restart() {
    state.current = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    showScreen("intro");
  }

  document.getElementById("btn-start").addEventListener("click", () => {
    renderQuestion();
    showScreen("question");
  });
  document.getElementById("btn-prev").addEventListener("click", goPrev);
  document.getElementById("btn-next-arrow").addEventListener("click", goNext);
  document.getElementById("btn-next").addEventListener("click", goNext);
  document.getElementById("btn-restart").addEventListener("click", restart);
</script>
</body>
</html>
